<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spatial Portfolio Experience</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

<a-scene background="color: black">

  <!-- ASSETS -->
  <a-assets timeout="15000">
    <img id="scene1" src="images/scene1.jpg">
    <img id="scene2" src="images/scene2.jpg">
    <img id="scene3" src="images/scene3.jpg">
    <img id="scene4" src="images/scene4.jpg">
  </a-assets>

  <!-- CAMERA -->
  <a-entity camera look-controls position="0 1.6 0">
    <a-cursor fuse="true" fuse-timeout="800" color="white"></a-cursor>
  </a-entity>

  <!-- SKY -->
  <a-sky id="sky" src="#scene1" rotation="0 -90 0"></a-sky>

  <!-- TITLE -->
  <a-text id="title"
          value="Scene 1"
          position="0 2 -2"
          align="center"
          color="#FFF"
          width="4">
  </a-text>

  <!-- HOTSPOTS -->
  <a-entity id="hotspots"></a-entity>

</a-scene>

<script>

// SCENE SYSTEM
const scenes = {

  scene1: {
    sky: "scene1",
    title: "Welcome Hub",
    hotspots: [
      { position: "2 1.5 -3", target: "scene2", label: "Snow World" },
      { position: "-2 1.5 -3", target: "scene3", label: "Island" },
      { position: "0 2.9 -4", target: "scene4", label: "Pacific Scene" }
    ]
  },

  scene2: {
    sky: "scene2",
    title: "Snow Environment",
    hotspots: [
      { position: "0 2.9 -3", target: "scene1", label: "Back to Hub" },
      { position: "2 1.5 -3", target: "scene3", label: "Go to Island" }
    ]
  },

  scene3: {
    sky: "scene3",
    title: "Island Environment",
    hotspots: [
      { position: "0 2.9 -3", target: "scene1", label: "Back to Hub" },
      { position: "-2 1.5 -3", target: "scene4", label: "Go to ocean view" }
    ]
  },

  scene4: {
    sky: "scene4",
    title: "Pacific Environment",
    hotspots: [
      { position: "0 2.9 -3", target: "scene1", label: "Back to Hub" },
      { position: "2 1.5 -3", target: "scene2", label: "Go to Snow" }
    ]
  }

};

let currentScene = "scene1";

const sky = document.querySelector("#sky");
const hotspotContainer = document.querySelector("#hotspots");
const title = document.querySelector("#title");

// LOAD SCENE
function loadScene(name){

  const scene = scenes[name];
  if(!scene) return;

  // FADE OUT
  sky.setAttribute("animation__fadeout", {
    property: "opacity",
    to: 0,
    dur: 300
  });

  setTimeout(() => {

    // CHANGE SKY
    sky.setAttribute("src", "#" + scene.sky);

    // UPDATE TITLE
    title.setAttribute("value", scene.title);

    // CLEAR HOTSPOTS
    hotspotContainer.innerHTML = "";

    // CREATE HOTSPOTS
    scene.hotspots.forEach(h => {

      const btn = document.createElement("a-circle");
      btn.setAttribute("position", h.position);
      btn.setAttribute("radius", "0.3");
      btn.setAttribute("color", "#00ffcc");
      btn.setAttribute("class", "clickable");

      // HOVER ANIMATION
      btn.setAttribute("animation__enter", {
        property: "scale",
        startEvents: "mouseenter",
        to: "1.3 1.3 1.3",
        dur: 150
      });

      btn.setAttribute("animation__leave", {
        property: "scale",
        startEvents: "mouseleave",
        to: "1 1 1",
        dur: 150
      });

      // TEXT
      const text = document.createElement("a-text");
      text.setAttribute("value", h.label);
      text.setAttribute("align", "center");
      text.setAttribute("position", "0 0.5 0");
      text.setAttribute("color", "#FFF");

      btn.appendChild(text);

      // CLICK
      btn.addEventListener("click", () => {
        loadScene(h.target);
      });

      hotspotContainer.appendChild(btn);
    });

    // FADE IN
    sky.setAttribute("animation__fadein", {
      property: "opacity",
      to: 1,
      dur: 300
    });

    currentScene = name;

  }, 300);
}

// INIT
loadScene("scene1");

</script>

</body>
</html>
